<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teacher dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
<link rel="stylesheet" href="/styles.css" />
<style>
  body { display: block; padding: 24px 20px 60px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card b { display: block; font-size: 26px; line-height: 1.2; }
  .card span { font-size: 13px; color: var(--muted); }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .bar-row .track { grid-column: 1 / -1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); }
  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .q .meta { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .q .ask { font-weight: 600; margin-bottom: 6px; }
  .q .ans { font-size: 14px; color: var(--muted); white-space: pre-wrap; max-height: 5.2em; overflow: hidden; }
  .q.open .ans { max-height: none; }
  .tag { background: rgba(179,38,30,.12); color: var(--error); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
  .empty { color: var(--muted); padding: 30px 0; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { font: inherit; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<h1>Teacher dashboard</h1>
<p class="muted small" id="built"></p>
<div class="actions">
  <button id="reload">Reload lessons</button>
  <button id="refresh">Refresh</button>
</div>

<div class="cards" id="cards"></div>

<h2>Questions per lesson</h2>
<div class="bars" id="lessons"></div>

<h2>Not covered by your lessons</h2>
<p class="muted small">Questions the bot could not answer from your material. These are your teaching gaps.</p>
<div id="gaps"></div>

<h2>Recent questions</h2>
<div id="recent"></div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function card(value, label) {
  return `<div class="card"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
}

function question(e) {
  const when = new Date(e.at).toLocaleString();
  const gap = e.grounded === false ? '<span class="tag">not in lessons</span>' : "";
  return `<div class="q" onclick="this.classList.toggle('open')">
    <div class="meta"><span>${esc(e.student || "anonymous")}</span><span>${esc(when)}</span><span>${esc(e.channel || "")}</span>${gap}</div>
    <div class="ask">${esc(e.question)}</div>
    <div class="ans">${esc(e.reply)}</div>
  </div>`;
}

async function load() {
  const data = await (await fetch("/api/teacher/stats")).json();

  document.getElementById("cards").innerHTML =
    card(data.total, "questions asked") +
    card(data.students, "students") +
    card(data.uncovered, "not in lessons") +
    card(data.today ?? 0, "asked today");

  const max = Math.max(1, ...data.byLesson.map((l) => l.count));
  document.getElementById("lessons").innerHTML =
    data.byLesson.length
      ? data.byLesson.map((l) => `<div class="bar-row">
          <span>${esc(l.title)}</span><span class="muted">${l.count}</span>
          <div class="track"><div class="fill" style="width:${(l.count / max) * 100}%"></div></div>
        </div>`).join("")
      : '<p class="empty">No questions yet.</p>';

  const gaps = data.recent.filter((e) => e.grounded === false);
  document.getElementById("gaps").innerHTML =
    gaps.length ? gaps.slice(0, 30).map(question).join("") : '<p class="empty">Nothing so far. Your lessons are covering what students ask.</p>';

  document.getElementById("recent").innerHTML =
    data.recent.length ? data.recent.slice(0, 60).map(question).join("") : '<p class="empty">No questions yet.</p>';
}

document.getElementById("refresh").onclick = load;
document.getElementById("reload").onclick = async () => {
  const res = await (await fetch("/api/teacher/reload", { method: "POST" })).json();
  document.getElementById("built").textContent = `Reloaded ${res.lessons} lesson(s).`;
  load();
};

load();
</script>
</body>
</html>
